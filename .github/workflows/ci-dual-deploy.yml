name: CI, Audit Governance & Dual Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug workspace
        run: |
          echo "Git ref: $GITHUB_REF"
          echo "Runner OS: $RUNNER_OS"
          pwd
          ls -la
          ls -la path/to/project || true
          env | sort

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

  audit-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify audit.log is ignored
        run: |
          if git ls-files | grep audit.log; then
            echo "❌ audit.log should not be committed"
            exit 1
          else
            echo "✅ audit.log is ignored"
          fi

  deploy-netlify:
    needs: [build, audit-governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        uses: netlify/actions/cli@v2
        with:
          args: deploy --dir=public --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-pages:
    needs: [build, audit-governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
